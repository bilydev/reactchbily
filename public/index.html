<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to Reaction Channel by Bily</title>
<meta name="description" content="Tempel link postingan Saluran WhatsApp, pilih sampai 5 emoji, lalu kirim reaksi. Dibuat oleh Bily Engineer.">
<meta name="theme-color" content="#1A1410">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F6EFE6;
    --cream-deep: #E8D9C5;
    --cream-line: #D9C4A8;
    --brown: #7A5238;
    --brown-dark: #3B2A1E;
    --black: #1A1410;
    --white: #FFFFFF;
    --ok: #1E9E54;
    --warn: #C98A0B;
    --bad: #C2332B;
    --err-bg: #FBE6E3;
    --radius-bubble: 18px;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--font);
    color: var(--black);
    background-color: var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(59,42,30,.10) 1px, transparent 0),
      radial-gradient(circle at 12px 14px, rgba(59,42,30,.06) 2px, transparent 0);
    background-size: 24px 24px, 36px 36px;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 460px; }

  h1 {
    font-size: clamp(30px, 8vw, 40px);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 18px 0 8px;
    color: var(--black);
  }
  .lead { margin: 0 0 22px; font-size: 16px; line-height: 1.45; color: var(--brown); max-width: 38ch; }

  .bubble {
    position: relative;
    background: var(--white);
    border-radius: var(--radius-bubble);
    border-top-left-radius: 4px;
    padding: 16px;
    box-shadow: 0 1px 0 rgba(59,42,30,.15);
    margin-bottom: 14px;
  }
  .bubble.out { background: var(--cream-deep); border-top-left-radius: var(--radius-bubble); border-top-right-radius: 4px; }
  label.field { display: block; font-weight: 600; font-size: 15px; margin-bottom: 8px; }

  .input-row { display: flex; gap: 8px; }
  input[type="url"] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px; color: var(--black);
    background: var(--cream);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 12px 14px;
    outline: none;
  }
  input[type="url"]::placeholder { color: #9A8472; }
  input[type="url"]:focus-visible { border-color: var(--brown-dark); }
  input[type="url"].bad { border-color: var(--bad); }
  input[type="url"].good { border-color: var(--brown); }

  .btn-ghost {
    font: inherit; font-weight: 600; font-size: 15px;
    color: var(--brown-dark); background: var(--cream);
    border: 0; border-radius: 12px; padding: 0 14px;
    cursor: pointer;
  }
  .btn-ghost:hover { background: var(--cream-deep); }
  .btn-ghost:focus-visible, .emoji:focus-visible, .slot:focus-visible, .send:focus-visible {
    outline: 3px solid var(--brown); outline-offset: 2px;
  }
  .hint { margin: 8px 2px 0; font-size: 14px; min-height: 20px; color: var(--brown); }
  .hint.bad { color: var(--bad); }

  .tray-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .tray-head strong { font-size: 15px; font-weight: 600; }
  .count { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px; }
  .count.full { color: var(--white); background: var(--black); padding: 2px 10px; border-radius: 99px; }

  .slots {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    background: var(--black);
    border-radius: 99px;
    padding: 8px;
    margin-bottom: 14px;
  }
  .slot {
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px dashed rgba(246,239,230,.3);
    background: transparent;
    font-size: 26px; line-height: 1;
    display: grid; place-items: center;
    padding: 0; cursor: default; color: #fff;
  }
  .slot.filled {
    border: 0; background: rgba(246,239,230,.16); cursor: pointer;
    animation: pop .22s ease-out;
  }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .emoji {
    position: relative;
    aspect-ratio: 1;
    font-size: 28px; line-height: 1;
    background: var(--cream);
    border: 2px solid transparent;
    border-radius: 16px;
    cursor: pointer;
    display: grid; place-items: center;
    padding: 0;
    transition: transform .12s ease, background .12s ease;
  }
  .emoji:hover { background: var(--cream-deep); }
  .emoji:active { transform: scale(.92); }
  .emoji[aria-pressed="true"] { background: #fff; border-color: var(--brown); box-shadow: 0 0 0 3px rgba(122,82,56,.22); }
  .emoji .n {
    position: absolute; top: -6px; right: -6px;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: var(--black); color: var(--white);
    font-size: 12px; font-weight: 800;
    display: none; align-items: center; justify-content: center;
  }
  .emoji[aria-pressed="true"] .n { display: flex; }
  .emoji.shake { animation: shake .3s; }
  @keyframes shake { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }

  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .send {
    flex: 1;
    font: inherit; font-weight: 800; font-size: 17px;
    color: #fff; background: var(--black);
    border: 0; border-radius: 14px; padding: 15px 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .send:disabled { background: #B3A293; cursor: not-allowed; }
  .send:not(:disabled):hover { background: var(--brown-dark); }
  .spin { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  .loading .spin { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { display: none; }
  .result.show { display: block; }
  .result .title { font-weight: 800; font-size: 16px; margin: 0 0 6px; }
  .result p { margin: 0 0 4px; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  .result .sent-emojis { font-size: 26px; letter-spacing: 4px; margin: 6px 0; }
  .result.err { background: var(--err-bg); color: var(--bad); }
  .result.ok { background: var(--cream-deep); }

  /* kotak ping API */
  .ping {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 22px 0 12px;
    background: var(--black);
    color: var(--cream);
    border-radius: 16px;
    padding: 12px 16px;
  }
  .ping-label { font-weight: 600; font-size: 15px; }
  .ping-val {
    display: flex; align-items: center; gap: 8px;
    font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #8B7B6C; flex: none; }
  .ping.ok .dot, .ping.ok .ms { background: var(--ok); }
  .ping.warn .dot, .ping.warn .ms { background: var(--warn); }
  .ping.bad .dot, .ping.bad .ms { background: var(--bad); }
  .ms { color: #fff; padding: 2px 10px; border-radius: 99px; background: #5A4A3C; }
  .ping .dot { background: #8B7B6C; }
  .ping.ok .dot { background: #5BE08E; }
  .ping.warn .dot { background: #F2B84B; }
  .ping.bad .dot { background: #FF7B72; }

  footer { text-align: center; font-size: 13px; line-height: 1.5; color: var(--brown); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Welcome to Reaction Channel by Bily</h1>
  <p class="lead">Website ini dibuat oleh Bily Engineer dengan senang hati.</p>

  <section class="bubble" aria-labelledby="lbl-link">
    <label class="field" id="lbl-link" for="link">Link postingan Saluran</label>
    <div class="input-row">
      <input id="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="https://whatsapp.com/channel/…/123" aria-describedby="hint">
      <button type="button" class="btn-ghost" id="paste">Tempel</button>
    </div>
    <p class="hint" id="hint" role="status">Buka postingan di Saluran, salin tautannya, lalu tempel di sini.</p>
  </section>

  <section class="bubble" aria-labelledby="lbl-emoji">
    <div class="tray-head">
      <strong id="lbl-emoji">Pilih emoji</strong>
      <span class="count" id="count" aria-live="polite">0 dari 5</span>
    </div>

    <div class="slots" id="slots" aria-label="Emoji terpilih"></div>
    <div class="grid" id="grid" role="group" aria-labelledby="lbl-emoji"></div>

    <div class="actions">
      <button type="button" class="send" id="send" disabled>
        <span class="spin" aria-hidden="true"></span>
        <span id="send-label">Kirim reaksi</span>
      </button>
      <button type="button" class="btn-ghost" id="reset" aria-label="Kosongkan pilihan emoji">Reset</button>
    </div>
  </section>

  <section class="bubble out result" id="result" role="status" aria-live="polite"></section>

  <div class="ping" id="ping" role="status" aria-live="polite">
    <span class="ping-label">Ping API React Bily</span>
    <span class="ping-val"><span class="dot" aria-hidden="true"></span><span class="ms" id="ms">…</span></span>
  </div>

  <footer>Copyright by Bily Engineer Website</footer>
</main>

<script>
(function () {
  'use strict';

  var EMOJIS = ['💐','💗','🗿','👍','😎','🤍','💝','💕','💞','🩷','🫰','📄','🤓'];
  var MAX = 5;
  var COOLDOWN_MS = 8000;
  var LINK_RE = /^https:\/\/(www\.)?whatsapp\.com\/channel\/[^\/\s?#]+\/\d+\/?(\?[^\s#]*)?(#\S*)?$/i;

  var $ = function (id) { return document.getElementById(id); };
  var linkEl = $('link'), hintEl = $('hint'), gridEl = $('grid'), slotsEl = $('slots');
  var countEl = $('count'), sendEl = $('send'), sendLabel = $('send-label'), resultEl = $('result');

  var selected = [];
  var busy = false;
  var cooldownUntil = 0;
  var tick = null;

  function linkValid() { return LINK_RE.test(linkEl.value.trim()); }

  function setHint(text, bad) {
    hintEl.textContent = text;
    hintEl.className = 'hint' + (bad ? ' bad' : '');
  }

  function validateLink() {
    var v = linkEl.value.trim();
    linkEl.className = '';
    if (!v) {
      setHint('Buka postingan di Saluran, salin tautannya, lalu tempel di sini.');
    } else if (linkValid()) {
      linkEl.className = 'good';
      setHint('Link sudah benar.');
    } else {
      linkEl.className = 'bad';
      setHint('Format harus https://whatsapp.com/channel/…/angka (link satu postingan, bukan link saluran).', true);
    }
    refresh();
  }

  function buildGrid() {
    EMOJIS.forEach(function (e) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'emoji';
      b.setAttribute('aria-pressed', 'false');
      b.setAttribute('data-e', e);
      b.setAttribute('aria-label', 'Emoji ' + e);
      var span = document.createElement('span');
      span.textContent = e;
      var n = document.createElement('span');
      n.className = 'n';
      n.setAttribute('aria-hidden', 'true');
      b.appendChild(span);
      b.appendChild(n);
      b.addEventListener('click', function () { toggle(e, b); });
      gridEl.appendChild(b);
    });
  }

  function toggle(e, btn) {
    var i = selected.indexOf(e);
    if (i > -1) {
      selected.splice(i, 1);
    } else {
      if (selected.length >= MAX) {
        btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
        setHint('Maksimal ' + MAX + ' emoji. Lepas salah satu dulu untuk memilih yang lain.', true);
        return;
      }
      selected.push(e);
    }
    if (hintEl.classList.contains('bad') && !linkEl.value) setHint('Buka postingan di Saluran, salin tautannya, lalu tempel di sini.');
    else if (hintEl.textContent.indexOf('Maksimal') === 0) validateLink();
    refresh();
  }

  function renderSlots() {
    slotsEl.textContent = '';
    for (var i = 0; i < MAX; i++) {
      var s = document.createElement('button');
      s.type = 'button';
      s.className = 'slot';
      var e = selected[i];
      if (e) {
        s.className += ' filled';
        s.textContent = e;
        s.setAttribute('aria-label', 'Lepas emoji ' + e);
        (function (em) {
          s.addEventListener('click', function () {
            selected.splice(selected.indexOf(em), 1);
            refresh();
          });
        })(e);
      } else {
        s.disabled = true;
        s.setAttribute('aria-hidden', 'true');
      }
      slotsEl.appendChild(s);
    }
  }

  function refresh() {
    Array.prototype.forEach.call(gridEl.children, function (b) {
      var idx = selected.indexOf(b.getAttribute('data-e'));
      b.setAttribute('aria-pressed', idx > -1 ? 'true' : 'false');
      b.querySelector('.n').textContent = idx > -1 ? String(idx + 1) : '';
    });
    renderSlots();
    countEl.textContent = selected.length + ' dari ' + MAX;
    countEl.className = 'count' + (selected.length === MAX ? ' full' : '');

    var remain = cooldownUntil - Date.now();
    var ready = linkValid() && selected.length >= 1 && !busy && remain <= 0;
    sendEl.disabled = !ready;
    sendEl.classList.toggle('loading', busy);
    if (busy) sendLabel.textContent = 'Mengirim…';
    else if (remain > 0) sendLabel.textContent = 'Tunggu ' + Math.ceil(remain / 1000) + ' detik';
    else sendLabel.textContent = 'Kirim reaksi';
  }

  function startCooldown() {
    cooldownUntil = Date.now() + COOLDOWN_MS;
    clearInterval(tick);
    tick = setInterval(function () {
      refresh();
      if (Date.now() >= cooldownUntil) clearInterval(tick);
    }, 500);
  }

  function showResult(ok, title, lines, emojis) {
    resultEl.className = 'bubble ' + (ok ? 'out ok' : 'err') + ' result show';
    resultEl.textContent = '';
    var t = document.createElement('p');
    t.className = 'title';
    t.textContent = title;
    resultEl.appendChild(t);
    if (emojis && emojis.length) {
      var em = document.createElement('p');
      em.className = 'sent-emojis';
      em.textContent = emojis.join(' ');
      resultEl.appendChild(em);
    }
    lines.forEach(function (l) {
      if (!l) return;
      var p = document.createElement('p');
      p.textContent = l;
      resultEl.appendChild(p);
    });
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function send() {
    if (sendEl.disabled) return;
    busy = true; refresh();
    resultEl.className = 'bubble out result';
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, 65000);
    try {
      var res = await fetch('/api/react', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link: linkEl.value.trim(), emojis: selected }),
        signal: ctrl.signal
      });
      var data = null;
      try { data = await res.json(); } catch (_) {}
      if (res.ok && data && data.success) {
        var lines = [data.message];
        if (data.failed && data.failed.length) lines.push('Gagal untuk: ' + data.failed.join(' '));
        if (data.took_ms) lines.push('Selesai dalam ' + data.took_ms + ' ms.');
        showResult(true, 'Reaksi terkirim', lines, data.sent || selected);
      } else {
        showResult(false, 'Reaksi gagal dikirim', [(data && data.message) || ('Server menjawab ' + res.status + '.')]);
      }
    } catch (err) {
      showResult(false, 'Reaksi gagal dikirim',
        [err && err.name === 'AbortError' ? 'Permintaan terlalu lama. Coba lagi.' : 'Tidak bisa terhubung ke server. Periksa koneksi Anda.']);
    } finally {
      clearTimeout(to);
      busy = false;
      startCooldown();
      refresh();
    }
  }

  /* ---------- ping API ----------
     Mengukur waktu respons /api/react (GET dijawab 405 = server hidup).
     Hijau: sampai 250 ms. Kuning: 251 sampai 499 ms. Merah: 500 ms ke atas atau error. */
  var pingBox = $('ping'), msEl = $('ms');
  var pinging = false;

  function setPing(state, text) {
    pingBox.className = 'ping ' + state;
    msEl.textContent = text;
  }

  async function ping() {
    if (pinging) return;
    pinging = true;
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, 8000);
    var t0 = performance.now();
    try {
      var res = await fetch('/api/react?ping=' + Date.now(), { method: 'GET', cache: 'no-store', signal: ctrl.signal });
      var ms = Math.round(performance.now() - t0);
      if (res.status >= 500) setPing('bad', 'Error');
      else if (ms >= 500) setPing('bad', ms + ' ms');
      else if (ms > 250) setPing('warn', ms + ' ms');
      else setPing('ok', ms + ' ms');
    } catch (_) {
      setPing('bad', 'Error');
    } finally {
      clearTimeout(to);
      pinging = false;
    }
  }

  $('paste').addEventListener('click', async function () {
    try {
      var txt = await navigator.clipboard.readText();
      linkEl.value = (txt || '').trim();
      validateLink();
    } catch (_) {
      linkEl.focus();
      setHint('Izin tempel ditolak. Tekan lama kolom link lalu pilih Tempel.', true);
    }
  });
  $('reset').addEventListener('click', function () { selected = []; refresh(); });
  linkEl.addEventListener('input', validateLink);
  sendEl.addEventListener('click', send);

  buildGrid();
  refresh();
  ping();
  setInterval(function () { if (!document.hidden) ping(); }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) ping(); });
})();
</script>
</body>
</html>
